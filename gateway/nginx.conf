# Nginx Reverse Proxy & Static SPA Hosting Configuration
# For production deployment with Apache APISIX, Keycloak, and Vue 3 SPA

server {
    listen 80;
    server_name localhost;

    # 1. Vue 3 Frontend Single Page Application (SPA)
    location / {
        proxy_pass http://host.docker.internal:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. API Gateway via APISIX for Multi-Tenant Microservices (FastAPI Backend)
    location /api/v1/ {
        proxy_pass http://apisix:9180/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Keycloak OIDC Authentication & Realm Token Endpoints
    location /realms/ {
        proxy_pass http://keycloak:8080/realms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
