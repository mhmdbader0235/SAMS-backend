$kind: http-request
name: "Step 3: Add Requested Resources"
description: Add requested resource lines with quantities and estimated unit pricing.
url: "{{baseUrl}}/api/v1/events/{{eventId}}/resources"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{teacherToken}}
body:
  type: text
  content: |-
    [
      {
        "resource_type_id": 1,
        "description": "Transport Bus",
        "quantity": 2,
        "unit_price": 150.00
      }
    ]
order: 3000
