[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "doumind-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic>=2.0.0",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.6",
    "asyncpg==0.29.0",
    "alembic==1.19.1",
    "SQLAlchemy==2.0.52",
    "PyJWT==2.9.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt<4.1",
    "cryptography>=42.0.0",
    "email-validator>=2.0.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==4.1.0",
    "ruff==0.6.8",
    "black==24.8.0",
]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — Black handles this
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
    "B904",   # within an except clause, raise exceptions with raise ... from err
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── Black ───────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "qa_e2e: black-box journeys that need a live stack (tests/e2e)",
    "qa_direct: one user, one action",
    "qa_deep: multi-step flow with rule and boundary checks",
    "qa_full: complete end-to-end journey across several users",
]
