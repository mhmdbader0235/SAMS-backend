name: doumind

services:
  db:
    image: postgres:16-alpine
    container_name: doumind-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: user_service_db
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - doumind-backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: doumind-keycloak
    command: start-dev --import-realm --features=organization
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_FEATURES: organization
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/user_service_db
      KC_DB_USERNAME: admin
      # Same underlying Postgres password as the `db` service above -- sourced
      # from the one POSTGRES_PASSWORD var so it can't drift into two values.
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      # Exposes /health/ready and /health/live on the management interface
      # (port 9000 by default) independently of start/start-dev -- consumed by
      # the healthcheck below and by `backend`'s depends_on condition.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8000:8080"
    volumes:
      # NOTE: SAMS-realm.json only pre-seeds the WebAuthn Passwordless *policy*
      # fields (RP entity name, resident key, etc). It does NOT include the
      # browser-passwordless login flow or bind it as the active browserFlow --
      # Keycloak organizations, and this flow/binding, don't round-trip through
      # realm export/import (verified). A fresh boot from this file therefore
      # has passkey policy configured but passkey LOGIN still inactive until an
      # operator runs `python setup_passkeys.py --apply` once against this realm.
      - ./SAMS-realm.json:/opt/keycloak/data/import/SAMS-realm.json
      - keycloak_data:/opt/keycloak/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No `curl` in this image -- the management server is plain HTTP, so a
      # raw HTTP/1.1 request over /dev/tcp avoids depending on a tool that may
      # not be there. Dev-mode + realm import can take a while to come up, so
      # this is generous with start_period/retries rather than failing fast.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: doumind-apisix
    restart: always
    environment:
      # CURRENTLY UNUSED -- nothing in apisix.yaml consumes this any more. It existed for the
      # openid-connect plugin, which was rolled back on 2026-09-08 because this app has two
      # token issuers and no APISIX auth plugin accepts both (see
      # docs/architecture/adr/0004-apisix-as-defense-in-depth-not-auth-authority.md).
      # Kept, rather than deleted, only so the "apisix" Keycloak client stays wired if edge
      # verification is ever revisited -- which requires unifying token issuance first, not a
      # config change here. The real value comes from the "apisix" client's Credentials tab in
      # the Keycloak admin console; SAMS-realm.json ships only a placeholder.
      APISIX_KC_CLIENT_SECRET: ${APISIX_KC_CLIENT_SECRET:-}
    ports:
      # Prometheus metrics only (APISIX's proxy port 9180 stays unpublished --
      # nginx is the sole ingress). Bound to host LOOPBACK because
      # /apisix/prometheus/metrics is unauthenticated; do not publish it on
      # 0.0.0.0 or in production -- scrape it from inside the network instead.
      - "127.0.0.1:9091:9091"
    volumes:
      - ./gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml

  gateway:
    image: nginx:1.19.0-alpine
    container_name: doumind-gateway
    restart: always
    ports:
      - "9080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
      - keycloak
      - apisix
      - frontend

  opa:
    image: openpolicyagent/opa:latest
    container_name: doumind-opa
    restart: always
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"

  backend:
    build:
      context: .
    container_name: doumind-backend
    restart: always
    env_file:
      # Everything the app already reads from a .env file when run bare on
      # the host (JWT_SECRET, ENCRYPTION_KEY, SUPER_ADMIN_*, GMAIL_SMTP_*,
      # FRONTEND_URL, CORS_EXTRA_ORIGINS, ...). The explicit `environment`
      # block below OVERRIDES the handful of values that must differ now that
      # this container is on the compose network instead of the host --
      # Compose always applies `environment` on top of `env_file`, regardless
      # of the order the two are declared in.
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      OPA_URL: http://opa:8181/v1/data/school/authz/allow
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      # back/ and front/ are sibling directories on disk -- this compose file
      # lives in back/, so the context must reach up and across to ../front,
      # never a bare "front" (which would resolve to back/front and not exist).
      context: ../front
      args:
        # Baked into the static JS bundle at build time (Vite has no runtime
        # env -- see front/src/api.js). This MUST be the public URL a
        # browser can reach (the company server's domain/IP + gateway port),
        # never an internal Docker service name like http://backend:8001.
        # Placeholder until the real deployment URL is known -- override with
        # VITE_API_URL in .env before building for real, then rebuild
        # (changing a build ARG does not take effect without one).
        VITE_API_URL: ${VITE_API_URL:-http://CHANGE_ME_public_gateway_url}
    container_name: doumind-frontend
    restart: always

volumes:
  doumind-backend_pgdata:
  keycloak_data:

