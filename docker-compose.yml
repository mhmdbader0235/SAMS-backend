name: doumind

services:
  db:
    image: postgres:16-alpine
    container_name: doumind-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_local_password
      POSTGRES_DB: user_service_db
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - doumind-backend_pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: doumind-keycloak
    command: start-dev --import-realm --features=organization
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_FEATURES: organization
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/user_service_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: secure_local_password
      KC_DB_SCHEMA: keycloak
    ports:
      - "8000:8080"
    volumes:
      # NOTE: SAMS-realm.json only pre-seeds the WebAuthn Passwordless *policy*
      # fields (RP entity name, resident key, etc). It does NOT include the
      # browser-passwordless login flow or bind it as the active browserFlow --
      # Keycloak organizations, and this flow/binding, don't round-trip through
      # realm export/import (verified). A fresh boot from this file therefore
      # has passkey policy configured but passkey LOGIN still inactive until an
      # operator runs `python setup_passkeys.py --apply` once against this realm.
      - ./SAMS-realm.json:/opt/keycloak/data/import/SAMS-realm.json
      - keycloak_data:/opt/keycloak/data
    depends_on:
      - db

  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: doumind-apisix
    restart: always
    environment:
      # CURRENTLY UNUSED -- nothing in apisix.yaml consumes this any more. It existed for the
      # openid-connect plugin, which was rolled back on 2026-09-08 because this app has two
      # token issuers and no APISIX auth plugin accepts both (see
      # docs/architecture/adr/0004-apisix-as-defense-in-depth-not-auth-authority.md).
      # Kept, rather than deleted, only so the "apisix" Keycloak client stays wired if edge
      # verification is ever revisited -- which requires unifying token issuance first, not a
      # config change here. The real value comes from the "apisix" client's Credentials tab in
      # the Keycloak admin console; SAMS-realm.json ships only a placeholder.
      APISIX_KC_CLIENT_SECRET: ${APISIX_KC_CLIENT_SECRET:-}
    ports:
      # Prometheus metrics only (APISIX's proxy port 9180 stays unpublished --
      # nginx is the sole ingress). Bound to host LOOPBACK because
      # /apisix/prometheus/metrics is unauthenticated; do not publish it on
      # 0.0.0.0 or in production -- scrape it from inside the network instead.
      - "127.0.0.1:9091:9091"
    volumes:
      - ./gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    image: nginx:1.19.0-alpine
    container_name: doumind-gateway
    restart: always
    ports:
      - "9080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - keycloak
      - apisix

  opa:
    image: openpolicyagent/opa:latest
    container_name: doumind-opa
    restart: always
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"

volumes:
  doumind-backend_pgdata:
  keycloak_data:

